# /etc/discowall/discowall.toml — discowalld's configuration.

# The interfaces to forward between, by name. One that does not exist yet is waited for.
interfaces = ["lan", "iot"]

# Address families (both on by default).
#ipv4 = true
#ipv6 = true

# Where discoctl talks to the daemon.
#control_socket = "/run/discowall/control.sock"

# The rules (see rules.toml); `discoctl save` writes it, `discoctl apply` or SIGHUP reloads it.
# Missing: nothing crosses (default policy drop, no rules).
#rules_file = "/etc/discowall/rules.toml"

# A packet identical to one seen within this window is dropped (a second reflector, a bridge that
# delivers twice). mDNS repeats announcements no faster than once per second.
#dedup_window_ms = 500

# Drop A/AAAA records with link-local addresses (fe80::/10, 169.254/16): unreachable from another
# segment, and clients try them first.
#strip_link_local = true

# A one-shot query from an ephemeral port (dig, some libraries) is asked on the target interfaces
# on the querier's behalf and the answers of this window are relayed to it by unicast. 0 drops them.
#legacy_window_ms = 500
