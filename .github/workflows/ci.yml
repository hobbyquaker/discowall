name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The namespace tests need user namespaces, ip, nsenter and python3; the ubuntu runner has
      # them all. The avahi test also needs avahi-daemon, avahi-utils and dbus-daemon, run inside
      # the namespaces. Both skip themselves, with a message, where they cannot run.
      - run: sudo apt-get update && sudo apt-get install -y avahi-daemon avahi-utils dbus
      # The namespace test runs discoctl from target/debug: build every binary first.
      - run: cargo build --all
      - run: cargo test --all
      - run: cargo build --release
      - run: ls -l target/release/discowalld target/release/discoctl
