name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The namespace test needs user namespaces, ip, nsenter and python3; the ubuntu runner has
      # them all. It skips itself, with a message, where it cannot run.
      - run: cargo test --all
      - run: cargo build --release
      - run: ls -l target/release/discowalld target/release/discoctl
