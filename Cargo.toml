[workspace]
resolver = "2"
members = ["crates/discowall-proto", "crates/discowalld", "crates/discoctl"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/hobbyquaker/discowall"
authors = ["Sebastian Raff"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
