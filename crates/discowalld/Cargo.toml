[package]
name = "discowalld"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

description = "discovery firewall: forwards mDNS between a router's interfaces under rules"

[package.metadata.deb]
name = "discowall"
maintainer = "Sebastian Raff <hobbyquaker@gmail.com>"
extended-description = """discowall forwards mDNS (Bonjour, Zeroconf) packets between a router's network \
interfaces, as avahi's reflector does, but under rules: which hosts and services from which \
network are visible in which other network. discoctl lists and edits the rules, watches the \
traffic and shows the learned host table."""
section = "net"
priority = "optional"
depends = ""
conf-files = ["/etc/discowall/discowall.toml", "/etc/discowall/rules.toml"]
assets = [
    ["target/release/discowalld", "usr/bin/", "755"],
    ["target/release/discoctl", "usr/bin/", "755"],
    ["../../contrib/discowall.toml", "etc/discowall/discowall.toml", "644"],
    ["../../contrib/rules.toml", "etc/discowall/rules.toml", "644"],
    ["../../contrib/discowalld.service", "lib/systemd/system/discowalld.service", "644"],
    ["../../README.md", "usr/share/doc/discowall/README.md", "644"],
    ["../../target/man/discowalld.1", "usr/share/man/man1/", "644"],
    ["../../target/man/discoctl.1", "usr/share/man/man1/", "644"],
    ["../../target/man/discoctl-rule.1", "usr/share/man/man1/", "644"],
]

[package.metadata.generate-rpm]
name = "discowall"
summary = "discovery firewall: forwards mDNS between a router's interfaces under rules"
license = "MIT"
assets = [
    { source = "target/release/discowalld", dest = "/usr/bin/discowalld", mode = "755" },
    { source = "target/release/discoctl", dest = "/usr/bin/discoctl", mode = "755" },
    { source = "../../contrib/discowall.toml", dest = "/etc/discowall/discowall.toml", mode = "644", config = true },
    { source = "../../contrib/rules.toml", dest = "/etc/discowall/rules.toml", mode = "644", config = true },
    { source = "../../contrib/discowalld.service", dest = "/usr/lib/systemd/system/discowalld.service", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/discowall/README.md", mode = "644", doc = true },
    { source = "../../target/man/discowalld.1", dest = "/usr/share/man/man1/discowalld.1", mode = "644", doc = true },
    { source = "../../target/man/discoctl.1", dest = "/usr/share/man/man1/discoctl.1", mode = "644", doc = true },
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_mangen = "0.3.3"
discowall-proto = { version = "0.0.3", path = "../discowall-proto" }
futures-util = "0.3.34"
hickory-proto = { version = "0.26.3", default-features = false, features = ["mdns"] }
libc = "0.2.190"
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.33.0"
nix = { version = "0.31.3", features = ["socket", "net", "uio"] }
rtnetlink = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "sync", "time", "signal", "io-util", "macros"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0.151"
toml = "1.1.8"
