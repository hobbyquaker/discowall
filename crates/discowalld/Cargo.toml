[package]
name = "discowalld"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
discowall-proto = { version = "0.1.0", path = "../discowall-proto" }
futures-util = "0.3.34"
libc = "0.2.190"
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.33.0"
nix = { version = "0.31.3", features = ["socket", "net", "uio"] }
rtnetlink = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "sync", "time", "signal", "io-util", "macros"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0.151"
